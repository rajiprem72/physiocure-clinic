<!-- =====================================================
     FLOATING CONTACT CSS
     ===================================================== -->

<style>

#physiocure-floating-contact {

    position: fixed !important;

    right: 20px !important;
    bottom: 20px !important;

    z-index: 999999 !important;

    display: flex;

    flex-direction: column;

    align-items: flex-end;

    font-family: Arial, sans-serif;

}


/* -----------------------------------------------
   MAIN ROUND BUTTON
   ----------------------------------------------- */

#physiocure-contact-button {

    width: 60px;
    height: 60px;

    border: none;

    border-radius: 50%;

    background: #117c72;

    color: white;

    cursor: pointer;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 27px;

    box-shadow:
        0 5px 20px rgba(0,0,0,0.30);

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;

}


#physiocure-contact-button:hover {

    transform: scale(1.08);

    box-shadow:
        0 7px 25px rgba(0,0,0,0.35);

}


/* -----------------------------------------------
   CONTACT OPTIONS
   ----------------------------------------------- */

#physiocure-contact-options {

    display: flex;

    flex-direction: column;

    gap: 10px;

    margin-bottom: 12px;

    opacity: 0;

    visibility: hidden;

    transform: translateY(15px);

    transition:
        opacity 0.25s ease,
        transform 0.25s ease,
        visibility 0.25s ease;

}


/* OPEN STATE */

#physiocure-floating-contact.open
#physiocure-contact-options {

    opacity: 1;

    visibility: visible;

    transform: translateY(0);

}


/* -----------------------------------------------
   CONTACT ITEMS
   ----------------------------------------------- */

.physiocure-contact-item {

    min-width: 175px;

    padding: 12px 18px;

    border-radius: 30px;

    color: white !important;

    text-decoration: none !important;

    display: flex;

    align-items: center;

    gap: 10px;

    font-size: 15px;

    box-shadow:
        0 4px 15px rgba(0,0,0,0.25);

    transition:
        transform 0.2s ease;

}


.physiocure-contact-item:hover {

    transform: translateX(-5px);

}


.physiocure-contact-item span {

    font-size: 20px;

    width: 25px;

    text-align: center;

}


/* -----------------------------------------------
   COLORS
   ----------------------------------------------- */

.physiocure-call {

    background: #117c72;

}


.physiocure-whatsapp {

    background: #25D366;

}


.physiocure-email {

    background: #555555;

}


/* -----------------------------------------------
   MOBILE
   ----------------------------------------------- */

@media (max-width: 768px) {

    #physiocure-floating-contact {

        right: 15px !important;

        bottom: 15px !important;

    }


    #physiocure-contact-button {

        width: 56px;

        height: 56px;

        font-size: 25px;

    }


    .physiocure-contact-item {

        min-width: 155px;

        padding: 11px 15px;

        font-size: 14px;

    }

}

</style>


<!-- =====================================================
     FLOATING CONTACT JAVASCRIPT
     ===================================================== -->

<script>

document.addEventListener("DOMContentLoaded", function () {

    const container =
        document.getElementById(
            "physiocure-floating-contact"
        );

    const button =
        document.getElementById(
            "physiocure-contact-button"
        );

    const icon =
        document.getElementById(
            "physiocure-contact-icon"
        );


    if (!container || !button) {
        return;
    }


    button.addEventListener("click", function (event) {

        event.stopPropagation();

        container.classList.toggle("open");


        const isOpen =
            container.classList.contains("open");


        button.setAttribute(
            "aria-expanded",
            isOpen
        );


        if (isOpen) {

            icon.className = "fas fa-xmark";

        } else {

            icon.className = "fas fa-stethoscope";
        }

    });


    /* Close when clicking outside */

    document.addEventListener("click", function (event) {

        if (!container.contains(event.target)) {

            container.classList.remove("open");

            button.setAttribute(
                "aria-expanded",
                "false"
            );

            icon.className = "fas fa-stethoscope";

        }

    });

});

</script>
  
<script src="js/script.js"></script>
